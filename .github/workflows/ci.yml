name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build service
        run: swift build --package-path service

      - name: Swift tests
        run: swift test --package-path service

      - name: Client tests
        run: node --test client/test/framing.test.mjs client/test/client.test.mjs client/test/envelope.test.mjs client/test/cua.test.mjs client/test/browser.test.mjs tools/test/*.test.mjs

      - name: Integration test
        run: node --test client/test/integration.test.mjs
