name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build service (debug)
        run: swift build --package-path service

      - name: Build service (release)
        run: swift build -c release --package-path service

      - name: Swift tests
        run: swift test --package-path service

      - name: Client and integration tests
        run: npm test
